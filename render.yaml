# Render blueprint — serviço web + base de dados Postgres + cron das mensagens
# proativas. Este ficheiro TEM de estar na raiz do repositório.
#
# Depois do primeiro deploy, define os segredos no painel do Render
# (ver docs/deploy.md): APP_BASE_URL, SMTP_*, TWILIO_*, e (opcional) STRIPE_*.

databases:
  - name: gestor-alojamento-db
    plan: free
    region: frankfurt

services:
  - type: web
    name: gestor-alojamento
    runtime: python
    rootDir: prototype
    region: frankfurt
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app --workers 2 --timeout 60 --bind 0.0.0.0:$PORT
    healthCheckPath: /login
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: gestor-alojamento-db
          property: connectionString
      - key: PYTHON_VERSION
        value: "3.12"
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: APP_BASE_URL
        sync: false        # https://<nome-do-servico>.onrender.com
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_WHATSAPP_FROM
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: MAIL_FROM
        sync: false        # ex.: "Gestor de Alojamento <ola@teudominio.pt>"
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_INICIAL
        sync: false
      - key: STRIPE_PRICE_INTERMEDIO
        sync: false
      - key: STRIPE_PRICE_PRO
        sync: false

  - type: cron
    name: gestor-alojamento-scheduler
    runtime: python
    rootDir: prototype
    region: frankfurt
    plan: free
    schedule: "*/15 * * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python scheduler.py
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: gestor-alojamento-db
          property: connectionString
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_WHATSAPP_FROM
        sync: false
